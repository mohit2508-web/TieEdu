services:
  postgres:
    image: postgres:16-alpine
    container_name: tieedu-school-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tieedu
      POSTGRES_PASSWORD: tieedu
      POSTGRES_DB: tieedu_school
    ports:
      - '5432:5432'
    volumes:
      - school_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tieedu -d tieedu_school']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tieedu-school-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - school_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: tieedu-school-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - school_minio:/data

volumes:
  school_pg:
  school_redis:
  school_minio:
