<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>TieEdu — Offline</title>
    <style>
      html { -webkit-tap-highlight-color: transparent; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(1.5rem + env(safe-area-inset-top, 0px)) 1.5rem
          calc(1.5rem + env(safe-area-inset-bottom, 0px));
        background: #fafaf9;
        color: #1a1a1a;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        line-height: 1.55;
        text-align: center;
      }
      .card { max-width: 24rem; }
      img { width: 3rem; height: auto; margin-bottom: 1.25rem; }
      h1 { font-size: 1.125rem; font-weight: 800; margin: 0 0 0.5rem; letter-spacing: -0.01em; }
      p { margin: 0 0 1.5rem; color: #5f6b7a; font-size: 0.875rem; }
      button {
        /* 48px: comfortably above the 44px minimum touch target. */
        min-height: 3rem;
        padding: 0 1.5rem;
        border: 0;
        border-radius: 0.75rem;
        background: #1f3a5f;
        color: #fff;
        font: inherit;
        font-weight: 700;
        font-size: 0.9375rem;
        cursor: pointer;
      }
      button:active { transform: scale(0.97); }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/logo.svg" alt="TieEdu" />
      <h1>You&rsquo;re offline</h1>
      <p>
        Pages you&rsquo;ve already opened stay available. Reconnect to load vaults, courses
        and your checkout.
      </p>
      <button type="button" onclick="window.location.reload()">Retry</button>
    </div>
  </body>
</html>
